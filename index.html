<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>트랩 대시: 익스트림 (Trap Dash EXTREME)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow-x: hidden; background: #090d16; color: #f8fafc;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .game-container {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 680px; padding: 10px;
    }
    h1 {
      margin: 2px 0 6px 0; color: #ef4444; font-size: 20px; text-align: center;
    }
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      margin-bottom: 8px; background: #1e293b; padding: 6px 12px; border-radius: 12px;
      border: 1px solid #334155; font-size: 11px; color: #cbd5e1; width: 100%;
    }
    .controls-bar select, .controls-bar input { cursor: pointer; }
    .canvas-wrapper { width: 100%; display: flex; justify-content: center; overflow: hidden; }
    canvas {
      background: #111827; border: 2px solid #ef4444; border-radius: 8px;
      width: 100%; max-width: 660px; height: auto; aspect-ratio: 660 / 320;
      cursor: pointer; touch-action: none;
    }

    /* 📱 모바일 터치 패드 스타일 */
    .mobile-controls {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; margin-top: 8px; padding: 0 4px; user-select: none;
    }
    .mobile-controls.hidden { display: none !important; }
    .d-pad { display: flex; gap: 8px; }
    .btn {
      background: #334155; color: #fff; border: 2px solid #475569;
      border-radius: 12px; font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn:active { background: #ef4444; border-color: #f8fafc; }
    .btn-dir { width: 58px; height: 48px; font-size: 18px; }
    .btn-jump { width: 85px; height: 48px; background: #2563eb; border-color: #3b82f6; font-size: 14px; }
    .btn-utility { width: 48px; height: 36px; font-size: 11px; background: #475569; }
    .utility-group { display: flex; gap: 6px; }

    .rank-board {
      margin-top: 8px; background: #1f2937; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #374151; width: 100%; font-size: 12px;
    }
    .rank-header { display: flex; justify-content: space-between; align-items: center; color: #f59e0b; margin-bottom: 4px; }
    .play-stats { display: flex; justify-content: space-between; align-items: center; color: #38bdf8; margin-top: 4px; border-top: 1px solid #374151; padding-top: 4px; }
    .reset-btn { background: #374151; color: #9ca3af; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
    .reset-btn:hover { background: #ef4444; color: #fff; }
    .rank-list { margin: 4px 0 0 0; padding-left: 20px; display: flex; gap: 15px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>☠️ TRAP DASH : EXTREME (HARDCORE)</h1>
    
    <div class="controls-bar">
      <label>💻 플랫폼:
        <select id="modeSelect">
          <option value="pc">🖥️ PC 모드</option>
          <option value="mobile" selected>📱 모바일 모드</option>
        </select>
      </label>
      <label>👤 캐릭터:
        <select id="charSelect">
          <option value="runner">🟡 런너 (밸런스)</option>
          <option value="dash">🔵 대시 (고속)</option>
          <option value="hopper">🟢 호퍼 (고점프)</option>
        </select>
      </label>
      <label><input type="checkbox" id="reduceMotionToggle"> ⚡ 효과 감소</label>
      <label><input type="checkbox" id="muteToggle"> 🔇 음소거</label>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="660" height="320"></canvas>
    </div>

    <!-- 📱 모바일 가상 컨트롤 패드 -->
    <div class="mobile-controls" id="mobileControls">
      <div class="d-pad">
        <button class="btn btn-dir" id="btnLeft">◀</button>
        <button class="btn btn-dir" id="btnRight">▶</button>
      </div>
      <div class="utility-group">
        <button class="btn btn-utility" id="btnPause">⏸️ 일시정지</button>
        <button class="btn btn-utility" id="btnReset">🔄 재시작</button>
      </div>
      <button class="btn btn-jump" id="btnJump">JUMP</button>
    </div>

    <div class="rank-board">
      <div class="rank-header">
        <span>🏆 최고 기록 (BEST RECORDS)</span>
        <button class="reset-btn" onclick="resetLeaderboard()">기록 초기화</button>
      </div>
      <ol id="rankList" class="rank-list"><li>기록 없음</li></ol>
      
      <div class="play-stats">
        <span id="playCountText">🎮 총 플레이 횟수: 0회</span>
        <button class="reset-btn" onclick="resetPlayCount()">횟수 초기화</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const keys = { ArrowLeft: false, ArrowRight: false, Space: false };
    let spaceHandled = false;

    const reduceMotionToggle = document.getElementById('reduceMotionToggle');
    const muteToggle = document.getElementById('muteToggle');
    const charSelect = document.getElementById('charSelect');
    const modeSelect = document.getElementById('modeSelect');
    const mobileControls = document.getElementById('mobileControls');

    let reduceMotion = false;
    let isMuted = false;

    if (reduceMotionToggle) reduceMotionToggle.addEventListener('change', (e) => { reduceMotion = e.target.checked; });
    if (muteToggle) muteToggle.addEventListener('change', (e) => { isMuted = e.target.checked; });
    if (charSelect) charSelect.addEventListener('change', (e) => { applyCharacterStats(e.target.value); });

    if (modeSelect) {
      modeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'pc') {
          mobileControls.classList.add('hidden');
        } else {
          mobileControls.classList.remove('hidden');
        }
      });
    }

    const CHARACTERS = {
      runner: { name: '런너', color: '#facc15', eyeColor: '#000', speed: 3.8, jumpPower: -8.2, type: 'runner' },
      dash:   { name: '대시', color: '#38bdf8', eyeColor: '#fff', speed: 4.6, jumpPower: -7.8, type: 'dash' },
      hopper: { name: '호퍼', color: '#4ade80', eyeColor: '#1e293b', speed: 3.4, jumpPower: -9.0, type: 'hopper' }
    };

    const player = {
      x: 30, y: 180, width: 20, height: 24, vx: 0, vy: 0,
      speed: 3.8, gravity: 0.48, jumpPower: -8.2, jumpCount: 0, maxJumps: 2,
      grounded: false, color: '#facc15', eyeColor: '#000', facing: 'right', animFrame: 0, type: 'runner'
    };

    function applyCharacterStats(type) {
      const stats = CHARACTERS[type] || CHARACTERS.runner;
      player.speed = stats.speed;
      player.jumpPower = stats.jumpPower;
      player.color = stats.color;
      player.eyeColor = stats.eyeColor;
      player.type = stats.type;
    }

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function playSound(type) {
      if (isMuted) return;
      try {
        initAudio();
        if (!audioCtx || audioCtx.state !== 'running') return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'die') {
          // 💥 타격 충격음 + 사망 사운드
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start(); osc.stop(audioCtx.currentTime + 0.35);

          // 폭발 노이즈음 추가
          const oscSub = audioCtx.createOscillator();
          const gainSub = audioCtx.createGain();
          oscSub.type = 'square';
          oscSub.frequency.setValueAtTime(80, audioCtx.currentTime);
          oscSub.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.2);
          gainSub.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gainSub.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
          oscSub.connect(gainSub); gainSub.connect(audioCtx.destination);
          oscSub.start(); oscSub.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'clear') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start(); osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch (e) {}
    }

    const mapWidth = 4000;
    let cameraX = 0, gameTime = 0, gameState = 'START', lastTime = performance.now();
    const finishLine = { x: 3900, y: 130, width: 35, height: 110 };

    // 💥 이펙트 관련 상태 변수
    let shakeTimer = 0;
    let flashTimer = 0;
    let shockwaves = [];

    const platforms = [
      { x: 0, y: 240, w: 350 }, { x: 420, y: 240, w: 220 }, { x: 720, y: 200, w: 180 },
      { x: 1000, y: 240, w: 300 }, { x: 1400, y: 210, w: 180 }, { x: 1680, y: 240, w: 250 },
      { x: 2030, y: 180, w: 160 }, { x: 2290, y: 240, w: 300 }, { x: 2700, y: 200, w: 200 },
      { x: 3000, y: 240, w: 200 }, { x: 3300, y: 220, w: 200 }, { x: 3600, y: 240, w: 350 }
    ];

    let obstacles = [], particles = [];

    function initObstacles() {
      obstacles = [
        { x: 120, y: 220, w: 18, h: 20, type: 'spike' },
        { x: 200, y: 240, w: 20, h: 20, type: 'popup_spike', triggered: false },
        { x: 260, y: 240, w: 40, h: 10, type: 'fake_floor', broken: false },
        { x: 450, y: -50, w: 35, h: 35, type: 'falling_rock', triggered: false, vy: 0 },
        { x: 530, y: 220, w: 18, h: 20, type: 'patrol', minX: 480, maxX: 610, dir: 1 },
        { x: 750, y: 180, w: 18, h: 20, type: 'spike' },
        { x: 820, y: 180, w: 20, h: 20, type: 'popup_spike', triggered: false },
        { x: 1050, y: -50, w: 30, h: 30, type: 'falling_rock', triggered: false, vy: 0 },
        { x: 1120, y: 240, w: 50, h: 10, type: 'fake_floor', broken: false },
        { x: 1210, y: 220, w: 18, h: 20, type: 'spike' },
        { x: 1440, y: 190, w: 20, h: 15, type: 'homing', triggered: false },
        { x: 1510, y: 190, w: 18, h: 20, type: 'patrol', minX: 1420, maxX: 1560, dir: -1 },
        { x: 1720, y: 240, w: 60, h: 10, type: 'fake_floor', broken: false },
        { x: 1820, y: -50, w: 40, h: 40, type: 'falling_rock', triggered: false, vy: 0 },
        { x: 2060, y: 160, w: 18, h: 20, type: 'spike' },
        { x: 2120, y: 160, w: 20, h: 15, type: 'homing', triggered: false },
        { x: 2330, y: 240, w: 20, h: 20, type: 'popup_spike', triggered: false },
        { x: 2420, y: 220, w: 18, h: 20, type: 'patrol', minX: 2350, maxX: 2550, dir: 1 },
        { x: 2510, y: -50, w: 35, h: 35, type: 'falling_rock', triggered: false, vy: 0 },
        { x: 2740, y: 180, w: 18, h: 20, type: 'spike' },
        { x: 2820, y: 180, w: 20, h: 15, type: 'homing', triggered: false },
        { x: 3040, y: 240, w: 40, h: 10, type: 'fake_floor', broken: false },
        { x: 3120, y: 220, w: 20, h: 20, type: 'popup_spike', triggered: false },
        { x: 3340, y: 200, w: 18, h: 20, type: 'spike' },
        { x: 3420, y: -50, w: 45, h: 45, type: 'falling_rock', triggered: false, vy: 0 },
        { x: 3640, y: 220, w: 20, h: 15, type: 'homing', triggered: false },
        { x: 3720, y: 240, w: 20, h: 20, type: 'popup_spike', triggered: false },
        { x: 3800, y: 220, w: 18, h: 20, type: 'spike' }
      ];
    }

    function togglePause() {
      initAudio();
      if (gameState === 'PLAYING') gameState = 'PAUSED';
      else if (gameState === 'PAUSED') { gameState = 'PLAYING'; lastTime = performance.now(); }
    }

    function triggerJump() {
      initAudio();
      if (gameState === 'PAUSED') togglePause();
      else if (gameState === 'PLAYING' && player.jumpCount < player.maxJumps) {
        player.vy = player.jumpPower; player.jumpCount++; playSound('jump');
        createParticles(player.x + 10, player.y + 24, player.color, 8, 'jump');
      } else if (gameState !== 'PLAYING') startGame();
    }

    window.addEventListener('blur', () => { if (gameState === 'PLAYING') gameState = 'PAUSED'; });

    canvas.addEventListener('click', (e) => {
      initAudio();
      if (gameState === 'PAUSED') {
        const rect = canvas.getBoundingClientRect();
        const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
        if (clickY > 185 && clickY < 230) {
          startGame();
          return;
        }
        togglePause();
      } else if (gameState !== 'PLAYING') {
        startGame();
      }
    });

    window.addEventListener('keydown', (e) => {
      initAudio();
      if (e.code === 'KeyP') { togglePause(); return; }
      if (e.code === 'KeyR' && gameState === 'PAUSED') { startGame(); return; }

      if (['Space', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        if (e.code === 'Space' && !spaceHandled) {
          spaceHandled = true;
          triggerJump();
        }
        keys[e.code] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') spaceHandled = false;
      if (Object.prototype.hasOwnProperty.call(keys, e.code)) keys[e.code] = false;
    });

    const bindTouch = (id, onPress, onRelease) => {
      const el = document.getElementById(id);
      if (!el) return;
      
      let isTouched = false;

      el.addEventListener('touchstart', (e) => {
        if (e.cancelable) e.preventDefault();
        isTouched = true;
        initAudio();
        onPress();
      }, { passive: false });

      el.addEventListener('touchend', (e) => {
        if (e.cancelable) e.preventDefault();
        isTouched = false;
        if (onRelease) onRelease();
      }, { passive: false });

      el.addEventListener('mousedown', () => {
        if (!isTouched) {
          initAudio();
          onPress();
        }
      });

      el.addEventListener('mouseup', () => {
        if (!isTouched && onRelease) onRelease();
      });
    };

    bindTouch('btnLeft', () => keys.ArrowLeft = true, () => keys.ArrowLeft = false);
    bindTouch('btnRight', () => keys.ArrowRight = true, () => keys.ArrowRight = false);
    bindTouch('btnJump', triggerJump);
    bindTouch('btnPause', togglePause);
    bindTouch('btnReset', () => { if (gameState === 'PAUSED') startGame(); });

    function startGame() {
      initAudio();
      incrementPlayCount();
      const selected = charSelect ? charSelect.value : 'runner';
      applyCharacterStats(selected);
      player.x = 30; player.y = 180; player.vx = 0; player.vy = 0; player.jumpCount = 0;
      cameraX = 0; gameTime = 0; particles = []; shockwaves = [];
      shakeTimer = 0; flashTimer = 0;
      initObstacles();
      gameState = 'PLAYING'; lastTime = performance.now();
    }

    function getSafeRecords() {
      try {
        const raw = localStorage.getItem('trap_extreme_ranks');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.filter(n => typeof n === 'number' && !isNaN(n)) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRecord(time) {
      let records = getSafeRecords();
      records.push(parseFloat(time.toFixed(1)));
      records.sort((a, b) => a - b);
      records = records.slice(0, 3);
      try { localStorage.setItem('trap_extreme_ranks', JSON.stringify(records)); } catch (e) {}
      updateRankBoard();
    }

    function updateRankBoard() {
      const records = getSafeRecords();
      const rankListEl = document.getElementById('rankList');
      if (!rankListEl) return;
      if (records.length === 0) rankListEl.innerHTML = '<li>기록 없음</li>';
      else rankListEl.innerHTML = records.map((r, i) => `<li><b>${i+1}위:</b> ${r}초</li>`).join('');
    }

    function resetLeaderboard() {
      try { localStorage.removeItem('trap_extreme_ranks'); } catch (e) {}
      updateRankBoard();
    }

    function getPlayCount() {
      try {
        const val = localStorage.getItem('trap_extreme_play_count');
        return val ? parseInt(val, 10) || 0 : 0;
      } catch (e) {
        return 0;
      }
    }

    function incrementPlayCount() {
      let count = getPlayCount() + 1;
      try { localStorage.setItem('trap_extreme_play_count', count); } catch (e) {}
      updatePlayCountDisplay();
    }

    function resetPlayCount() {
      try { localStorage.removeItem('trap_extreme_play_count'); } catch (e) {}
      updatePlayCountDisplay();
    }

    function updatePlayCountDisplay() {
      const el = document.getElementById('playCountText');
      if (el) el.innerText = `🎮 총 플레이 횟수: ${getPlayCount()}회`;
    }

    // 💥 파티클 생성 강화 (사망시 방사형 파편 생성)
    function createParticles(x, y, color, count, mode = 'normal') {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        let vx, vy, size, gravity;
        if (mode === 'die') {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 8 + 2;
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
          size = Math.random() * 5 + 3;
          gravity = 0.2;
        } else {
          vx = (Math.random() - 0.5) * 6;
          vy = (Math.random() - 0.5) * 6;
          size = 4;
          gravity = 0;
        }
        particles.push({
          x, y, vx, vy, life: 1.0, color, size, gravity
        });
      }
    }

    function update(dt) {
      if (shakeTimer > 0) shakeTimer -= dt;
      if (flashTimer > 0) flashTimer -= dt;

      // 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.gravity) p.vy += p.gravity;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }

      // 충격파 링 업데이트
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 6;
        sw.alpha -= 0.05;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      if (gameState !== 'PLAYING') return;
      const effectiveDt = Math.min(dt, 0.1);
      gameTime += effectiveDt;

      if (keys.ArrowLeft) { player.vx = -player.speed; player.facing = 'left'; player.animFrame += 0.2; }
      else if (keys.ArrowRight) { player.vx = player.speed; player.facing = 'right'; player.animFrame += 0.2; }
      else { player.vx = 0; player.animFrame = 0; }

      player.vy += player.gravity; player.x += player.vx; player.y += player.vy;
      if (player.x < 0) player.x = 0;

      player.grounded = false;
      platforms.forEach(p => {
        if (
          player.x + player.width > p.x && player.x < p.x + p.w &&
          player.y + player.height >= p.y && player.y + player.height <= p.y + 15 && player.vy >= 0
        ) {
          player.y = p.y - player.height; player.vy = 0; player.jumpCount = 0; player.grounded = true;
        }
      });

      if (player.y > canvas.height + 40) triggerGameOver();

      cameraX = player.x - 180;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > mapWidth - canvas.width) cameraX = mapWidth - canvas.width;

      obstacles.forEach(obs => {
        if (obs.type === 'popup_spike') {
          if (Math.abs(player.x - obs.x) < 90) obs.triggered = true;
          if (obs.triggered && obs.y > 195) obs.y -= 5;
        }
        if (obs.type === 'fake_floor') {
          if (player.x + player.width > obs.x && player.x < obs.x + obs.w && Math.abs((player.y + player.height) - obs.y) < 5) obs.broken = true;
        }
        if (obs.type === 'falling_rock') {
          if (Math.abs(player.x - obs.x) < 140) obs.triggered = true;
          if (obs.triggered) { obs.vy += 0.7; obs.y += obs.vy; }
        }
        if (obs.type === 'patrol') {
          obs.x += obs.dir * 3.0;
          if (obs.x < obs.minX || obs.x > obs.maxX) obs.dir *= -1;
        }
        if (obs.type === 'homing') {
          if (Math.abs(player.x - obs.x) < 280) obs.triggered = true;
          if (obs.triggered) obs.x -= 7.5;
        }
        if (obs.type !== 'fake_floor' || !obs.broken) {
          if (player.x < obs.x + obs.w && player.x + player.width > obs.x && player.y < obs.y + obs.h && player.y + player.height > obs.y) triggerGameOver();
        }
      });

      if (player.x < finishLine.x + finishLine.width && player.x + player.width > finishLine.x && player.y < finishLine.y + finishLine.height && player.y + player.height > finishLine.y) {
        gameState = 'CLEAR'; playSound('clear'); saveRecord(gameTime); createParticles(player.x, player.y, '#10b981', 30);
      }
    }

    // 💥 사망 및 충돌 연출 트리거
    function triggerGameOver() {
      if (gameState === 'GAMEOVER') return;
      gameState = 'GAMEOVER';
      playSound('die');
      
      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;

      // 화면 흔들림 및 붉은 섬광 발동
      if (!reduceMotion) {
        shakeTimer = 0.35;
        flashTimer = 0.12;
        // 충격파 링 생성
        shockwaves.push({ x: centerX, y: centerY, radius: 5, alpha: 1.0 });
      }

      // 사방으로 뿜어져 나가는 피/파편 파티클
      createParticles(centerX, centerY, '#ef4444', 35, 'die');
      createParticles(centerX, centerY, player.color, 25, 'die');
      createParticles(centerX, centerY, '#ffffff', 15, 'die');
    }

    function drawPlayer(x, y) {
      ctx.save(); ctx.translate(x, y);
      const legOffset = Math.sin(player.animFrame) * 4;

      ctx.fillStyle = player.color;
      ctx.beginPath();
      
      if (typeof ctx.roundRect === 'function') {
        ctx.roundRect(0, 0, 20, 18, 4);
      } else {
        ctx.rect(0, 0, 20, 18);
      }
      ctx.fill();

      if (player.type === 'dash') { ctx.fillStyle = '#0284c7'; ctx.fillRect(player.facing === 'right' ? 6 : 2, 3, 12, 5); }
      else if (player.type === 'hopper') { ctx.fillStyle = '#22c55e'; ctx.fillRect(4, -4, 3, 5); ctx.fillRect(13, -4, 3, 5); }

      ctx.fillStyle = player.eyeColor;
      const eyeX = player.facing === 'right' ? 12 : 3;
      ctx.fillRect(eyeX, 6, 4, 5);

      ctx.fillStyle = '#334155';
      if (!player.grounded) { ctx.fillRect(3, 17, 4, 6); ctx.fillRect(13, 15, 4, 6); }
      else { ctx.fillRect(3, 17, 4, 7 + legOffset); ctx.fillRect(13, 17, 4, 7 - legOffset); }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      // 💥 화면 흔들림 효과 적용
      if (shakeTimer > 0) {
        const shakeX = (Math.random() - 0.5) * 14;
        const shakeY = (Math.random() - 0.5) * 14;
        ctx.translate(shakeX, shakeY);
      }

      ctx.translate(-cameraX, 0);

      // 플랫폼 및 장애물 그리기
      platforms.forEach(p => { ctx.fillStyle = '#1e293b'; ctx.fillRect(p.x, p.y, p.w, 80); });
      obstacles.forEach(obs => {
        if (obs.type === 'fake_floor') { if (!obs.broken) { ctx.fillStyle = '#334155'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h); } }
        else { ctx.fillStyle = '#ef4444'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h); }
      });

      ctx.fillStyle = '#10b981'; ctx.fillRect(finishLine.x, finishLine.y, finishLine.width, finishLine.height);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('FINISH', finishLine.x + 1, finishLine.y + 60);

      // 생존 시 플레이어 그리기 (사망 시 플레이어 숨김 및 파티클 대체)
      if (gameState !== 'GAMEOVER') {
        drawPlayer(player.x, player.y);
      }

      // 💥 충격파 파동 링 그리기
      shockwaves.forEach(sw => {
        ctx.save();
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(239, 68, 68, ${sw.alpha})`;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
      });

      // 파티클 그리기
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x, p.y, p.size || 4, p.size || 4);
      });
      ctx.globalAlpha = 1.0; ctx.restore();

      // 💥 사망 시 화면 붉은색 플래시 충격 효과
      if (flashTimer > 0) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // UI 텍스트 표시
      ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`⏱️ 시간: ${gameTime.toFixed(1)}초`, 15, 25);
      const progress = Math.min(100, Math.floor((player.x / finishLine.x) * 100));
      ctx.fillText(`🚩 진행도: ${progress}% (난이도: 최상)`, 15, 45);

      // 게임 상태별 오버레이
      if (gameState !== 'PLAYING') {
        ctx.fillStyle = 'rgba(9, 13, 22, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        if (gameState === 'START') {
          ctx.fillStyle = '#ef4444'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('TRAP DASH : EXTREME (HARDCORE)', canvas.width / 2, 110);
          ctx.fillStyle = '#cbd5e1'; ctx.font = '13px sans-serif'; ctx.fillText('극악의 트랩을 돌파하세요!', canvas.width / 2, 150);
          ctx.fillStyle = '#f59e0b'; ctx.fillText('[Space] / [JUMP 버튼] / [터치]로 시작', canvas.width / 2, 200);
        } else if (gameState === 'PAUSED') {
          ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 26px sans-serif'; ctx.fillText('⏸️ PAUSED (일시정지)', canvas.width / 2, 100);
          ctx.fillStyle = '#cbd5e1'; ctx.font = '14px sans-serif'; ctx.fillText('[P] 키 / [⏸️ 버튼] / 화면 클릭: 계속 진행', canvas.width / 2, 150);
          
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(canvas.width / 2 - 110, 185, 220, 36);
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px sans-serif';
          ctx.fillText('🔄 [R] 키 / [🔄 버튼]: 재시작', canvas.width / 2, 208);
        } else if (gameState === 'GAMEOVER') {
          ctx.fillStyle = '#ef4444'; ctx.font = 'bold 28px sans-serif'; ctx.fillText('☠️ YOU DIED', canvas.width / 2, 110);
          ctx.fillStyle = '#cbd5e1'; ctx.font = '14px sans-serif'; ctx.fillText(`진행도 ${progress}% 지점 사망`, canvas.width / 2, 155);
          ctx.fillStyle = '#38bdf8'; ctx.fillText('[Space] / [JUMP 버튼] 눌러 재도전', canvas.width / 2, 200);
        } else if (gameState === 'CLEAR') {
          ctx.fillStyle = '#10b981'; ctx.font = 'bold 26px sans-serif'; ctx.fillText('🏆 EXTREME CLEAR!!', canvas.width / 2, 110);
          ctx.fillStyle = '#f8fafc'; ctx.font = '15px sans-serif'; ctx.fillText(`기록: ${gameTime.toFixed(1)}초`, canvas.width / 2, 155);
          ctx.fillStyle = '#f59e0b'; ctx.fillText('[Space] / [JUMP 버튼] 눌러 다시 도전', canvas.width / 2, 200);
        }
        ctx.textAlign = 'left';
      }
    }

    function gameLoop(timestamp) {
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      update(dt); draw();
      requestAnimationFrame(gameLoop);
    }

    applyCharacterStats('runner');
    updateRankBoard();
    updatePlayCountDisplay();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
