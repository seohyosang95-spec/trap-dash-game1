<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>트랩 대시: 모바일 지원</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0; background: #090d16; color: #f8fafc;
      font-family: 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; touch-action: manipulation;
    }
    .game-container { width: 100%; max-width: 660px; padding: 10px; text-align: center; }
    h1 { margin: 0 0 6px 0; color: #ef4444; font-size: 18px; }
    .controls-bar {
      display: flex; gap: 8px; align-items: center; justify-content: center;
      margin-bottom: 8px; background: #1e293b; padding: 6px; border-radius: 8px;
      font-size: 11px; border: 1px solid #334155;
    }
    canvas {
      background: #111827; border: 2px solid #ef4444; border-radius: 8px;
      width: 100%; height: auto; aspect-ratio: 660 / 320; touch-action: none;
    }
    .toggle-box { background: #dc2626; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

    /* 📱 모바일 가상 패드 스타일 */
    .mobile-controls {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; margin-top: 10px; padding: 0 5px; user-select: none;
    }
    .d-pad { display: flex; gap: 10px; }
    .btn {
      background: #334155; color: #fff; border: 2px solid #475569;
      border-radius: 12px; font-size: 18px; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      active { background: #ef4444; border-color: #f8fafc; }
      cursor: pointer;
    }
    .btn-dir { width: 60px; height: 50px; }
    .btn-jump { width: 90px; height: 50px; background: #2563eb; border-color: #3b82f6; }
    .btn-utility { width: 50px; height: 35px; font-size: 12px; background: #475569; }
    .utility-group { display: flex; gap: 6px; }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>☠️ TRAP DASH : MOBILE</h1>
    
    <div class="controls-bar">
      <span>🎮 [PC] 방향키, Space | [모바일] 터치 버튼</span>
      <label class="toggle-box">
        <input type="checkbox" id="reduceMotionToggle"> ⚡ 효과 감소
      </label>
    </div>

    <canvas id="gameCanvas" width="660" height="320"></canvas>

    <!-- 📱 모바일 가상 패드 UI -->
    <div class="mobile-controls">
      <div class="d-pad">
        <button class="btn btn-dir" id="btnLeft">◀</button>
        <button class="btn btn-dir" id="btnRight">▶</button>
      </div>
      <div class="utility-group">
        <button class="btn btn-utility" id="btnPause">⏸️ 일시정지</button>
        <button class="btn btn-utility" id="btnReset">🔄 재시작</button>
      </div>
      <button class="btn btn-jump" id="btnJump">JUMP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const reduceMotionToggle = document.getElementById('reduceMotionToggle');
    let reduceMotion = false;
    reduceMotionToggle.addEventListener('change', (e) => { reduceMotion = e.target.checked; });

    let gameState = 'START';
    let player = { x: 30, y: 180, w: 20, h: 24, vx: 0, vy: 0, speed: 3.8, jumpCount: 0 };
    let cameraX = 0, shakeTime = 0, shakeIntensity = 0;
    let particles = [];
    const keys = { ArrowLeft: false, ArrowRight: false };

    const obstacles = [
      { x: 150, y: 220, w: 20, h: 20 },
      { x: 300, y: 200, w: 20, h: 40 },
      { x: 450, y: 220, w: 20, h: 20 },
      { x: 600, y: 180, w: 30, h: 20 }
    ];

    // 📱 터치 및 키보드 통합 컨트롤
    function handleJump() {
      if (gameState === 'PLAYING' && player.jumpCount < 2) {
        player.vy = -8.5; player.jumpCount++;
        createParticles(player.x + 10, player.y + 24, '#f8fafc', 12, 4);
      } else if (gameState !== 'PLAYING' && gameState !== 'PAUSED') {
        resetGame();
      }
    }

    function handlePause() {
      if (gameState === 'PLAYING' || gameState === 'PAUSED') {
        gameState = gameState === 'PLAYING' ? 'PAUSED' : 'PLAYING';
      }
    }

    // PC 키보드 이벤트
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
      if (e.code === 'ArrowRight') keys.ArrowRight = true;
      if (e.code === 'KeyP') handlePause();
      if (e.code === 'KeyR' && gameState === 'PAUSED') resetGame();
      if (e.code === 'Space') handleJump();
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
      if (e.code === 'ArrowRight') keys.ArrowRight = false;
    });

    // 📱 모바일 터치 이벤트 바인딩
    const bindTouch = (id, onPress, onRelease) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); }, { passive: false });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (onRelease) onRelease(); }, { passive: false });
      el.addEventListener('mousedown', onPress);
      el.addEventListener('mouseup', onRelease);
    };

    bindTouch('btnLeft', () => keys.ArrowLeft = true, () => keys.ArrowLeft = false);
    bindTouch('btnRight', () => keys.ArrowRight = true, () => keys.ArrowRight = false);
    bindTouch('btnJump', handleJump);
    bindTouch('btnPause', handlePause);
    bindTouch('btnReset', () => { if (gameState === 'PAUSED') resetGame(); });

    canvas.addEventListener('click', () => {
      if (gameState !== 'PLAYING' && gameState !== 'PAUSED') resetGame();
    });

    function resetGame() {
      player.x = 30; player.y = 180; player.vx = 0; player.vy = 0; player.jumpCount = 0;
      cameraX = 0; particles = []; shakeTime = 0; gameState = 'PLAYING';
    }

    function createParticles(x, y, color, count, maxSpeed = 5, size = 4) {
      if (reduceMotion) return;
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * maxSpeed,
          vy: (Math.random() - 0.5) * maxSpeed,
          size: Math.random() * size + 2,
          color, life: 1.0
        });
      }
    }

    function triggerShake(intensity, duration) {
      if (reduceMotion) return;
      shakeIntensity = intensity; shakeTime = duration;
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.ArrowLeft) player.x -= player.speed;
      if (keys.ArrowRight) player.x += player.speed;
      player.vy += 0.45; player.y += player.vy;

      if (player.y >= 216) { player.y = 216; player.vy = 0; player.jumpCount = 0; }
      if (player.x < 0) player.x = 0;

      cameraX = player.x - 100;

      obstacles.forEach(o => {
        if (player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
          gameState = 'GAMEOVER';
          createParticles(player.x + 10, player.y + 12, '#ef4444', 40, 10, 6);
          triggerShake(8, 20);
        }
      });

      if (player.x >= 800) {
        gameState = 'CLEAR';
        createParticles(player.x, player.y, '#10b981', 60, 12, 5);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (shakeTime > 0) shakeTime--;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();

      if (shakeTime > 0) {
        let dx = (Math.random() - 0.5) * shakeIntensity;
        let dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy);
      }

      ctx.translate(-cameraX, 0);

      ctx.fillStyle = '#334155'; ctx.fillRect(0, 240, 1000, 80);
      ctx.fillStyle = '#ef4444'; obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.w, o.h));
      ctx.fillStyle = '#10b981'; ctx.fillRect(800, 160, 20, 80);
      ctx.fillStyle = '#facc15'; ctx.fillRect(player.x, player.y, player.w, player.h);

      particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      ctx.globalAlpha = 1.0; ctx.restore();

      if (gameState !== 'PLAYING') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '20px sans-serif';
        if (gameState === 'START') ctx.fillText('화면 또는 버튼을 터치해 시작', 330, 160);
        if (gameState === 'PAUSED') ctx.fillText('⏸️ 일시정지 (버튼 터치로 계속/재시작)', 330, 160);
        if (gameState === 'GAMEOVER') ctx.fillText('☠️ 실패! 터치하여 재도전', 330, 160);
        if (gameState === 'CLEAR') ctx.fillText('🏆 성공! 터치하여 재도전', 330, 160);
        ctx.textAlign = 'left';
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
